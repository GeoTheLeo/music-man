# Local Neo4j for Music Man's fraud-ring graph (Graph Data Science plugin
# included for connected-components ring detection). Development only:
# the password below is a local default, override it via NEO4J_PASSWORD.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: music-man-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-musicman-dev}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
